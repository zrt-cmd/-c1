/**:
  ros__parameters:
    joints:
      arm_joint1: {id: 0, init: 1500, min: 500, max: 2500, orientation: 1}
      arm_joint2: {id: 1, init: 1500, min: 500, max: 2500, orientation: 1}
      arm_joint3: {id: 2, init: 1500, min: 500, max: 2500, orientation: 1}
      arm_joint4: {id: 3, init: 1500, min: 500, max: 2500, orientation: 1}
      arm_joint5: {id: 4, init: 1500, min: 500, max: 2500, orientation: 1}
      r_joint:    {id: 5, init: 1500, min: 800, max: 1500, orientation: -1}  # gripper opens to PWM 800
    controllers:
      arm_controller:
        joints: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5]
        action_name: arm_controller/follow_joint_trajectory
      gripper_controller:
        joints: [r_joint]
        action_name: gripper_controller/follow_joint_trajectory
    publish_rate: 3.0  # Each tick reads ONE servo (round-robin); 6 servos refresh in ~2s. Low rate keeps serial bandwidth for motor/IMU; arm is static during detection so high-rate readback is unneeded.
