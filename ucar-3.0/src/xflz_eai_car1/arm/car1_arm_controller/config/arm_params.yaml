/**:
  ros__parameters:
    # 机械臂连杆参数（单位：米）
    d1: 0.1005      # 底座高度 (arm_base_joint.z + arm_joint1.z = 0.057 + 0.0435)
    a2: 0.12614     # 大臂长度
    a3: 0.12614     # 小臂长度
    a4: 0.151       # joint4 到 tcp_link 距离（夹爪张开时的指尖位置，0.0744 + 0.0762）

    # 关节限位（单位：弧度）
    joint_limits:
      arm_joint1: [-3.14, 3.14]
      arm_joint2: [-3.14, 3.14]
      arm_joint3: [-3.14, 3.14]
      arm_joint4: [-3.14, 3.14]
      arm_joint5: [-3.14, 3.14]

    # 舵机 ID 映射
    servo_ids:
      arm_joint1: 1
      arm_joint2: 2
      arm_joint3: 3
      arm_joint4: 4
      arm_joint5: 5
      gripper: 10

    # 夹爪参数
    # 1.649 rad × 424.4 ticks/rad ≈ 700 ticks；orientation=-1 → PWM 1500-700=800。
    gripper_open_angle: 1.649  # 张开角度（弧度），对应 PWM 800
    gripper_close_angle: 0.0   # 闭合角度（弧度）
    gripper_duration: 2.0      # 夹爪运动时间（秒）- 增大到 2s 确保舵机到位

    # 运动参数
    default_duration: 2.0      # 默认运动时间（秒）
    gripper_duration: 1.0      # 夹爪运动时间（秒）

    # 抓取参数
    # tcp_link 定义位置到夹爪最前端还差 33mm，抓取时 TCP 要停高 33mm，
    # 让指尖到达检测到的红块表面位置（否则指尖会撞地面/桌面）
    gripper_depth: -0.033      # TCP 高于目标 33mm（负值 = 抬高）
    pre_grasp_height: 0.03     # 预抓取高度（目标上方 3cm）

    # 抓取完成后回到的姿态（work 位姿）
    # TCP: (0.186, 0, 0.365), pitch=90°=水平向前
    post_grasp_pose: [0.18572, 0.00021, 0.36481, 1.5708]
