# 实验 02 — 垃圾分类配置
# 模型事实（rubbish_2_7.rknn 元数据核实，2026-08-05）：
#   输入 [1,3,640,640] nchw float32 range[0,1] mean[0,0,0] std[255,255,255] rgb2bgr=False
#   输出 3 尺度 [1,75,80,80] / [1,75,40,40] / [1,75,20,20]；75 = 3 anchors × (4+1+20)
#   → YOLOv5 式检测头（非扁平分类）：逐目标检测 + 20 细类 + 4 大类映射

model:
  path: ../models/garbage_yolov5_20cls.rknn        # 相对本配置文件目录解析（模型在项目根 models/）
  labels: labels.txt                             # 相对本配置文件目录解析
  category_map: category_map.txt                 # 相对本配置文件目录解析
  category_names:                                    # 大类名称（1-4）
    "1": recyclable
    "2": kitchen_waste
    "3": hazardous_waste
    "4": other_waste

infer:
  imgsz: 640                     # 模型输入（元数据核实）
  preprocess: letterbox          # letterbox 640，pad 0（模型动物园约定）
  score_thr: 0.25                # 参考 func.py OBJ_THRESH
  nms_thr: 0.45                  # 参考 func.py NMS_THRESH
  sigmoid: False                  # 后处理应用 sigmoid（图内已含则仅压缩分数，单调不变）
  anchors: anchors.txt                           # 相对本配置文件目录解析（yolov5 默认锚，以导出配置为准）

pool:
  tpes: 2
  core_mask: auto                # 板端实测：round_robin [1,2,4] 在两核 RK3576 上会卡死（CORE_2→0 替换致同核并发）

server:
  host: 0.0.0.0
  port: 8080                     # MJPEG: http://<ip>:8080/garbage_cam.mjpg
  stream_name: garbage_cam
  quality: 80
  fps: 30


source:
  ros:
    rgb_topic: /ascamera_hp60c/camera_publisher/rgb0/image   # ascamera HP60C 原生话题（勿 remap）
    timeout: 5.0                                             # 首帧等待秒数
