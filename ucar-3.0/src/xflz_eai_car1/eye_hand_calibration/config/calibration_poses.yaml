# 标定采集姿态配置（v2 - 增强旋转多样性）
# 原理：手眼标定 AX=XB 需要足够的旋转多样性
#   - 机械臂末端指向（Z轴）应覆盖 >60° 的范围
#   - 相邻姿态间旋转角 >15°
#   - 覆盖工作空间前/后/左/右
#
# 使用建议：
#   - AprilTag 固定在桌面中央（机械臂正前方约 25cm）
#   - pitch=3.14=相机竖直朝下, pitch=2.80≈160°=前倾20°, pitch=2.44≈140°=前倾40°
#   - 更大的 pitch 变化 = 更好的旋转多样性
#
# 设计：
#   1. 正前近距离 + 远距离（改变距离，略微改变指向）
#   2. 左右两侧大角度（y=±0.10, J1≈±20°）
#   3. 三个不同 pitch（拉大旋转范围）
#   4. 高低不同的 Z（影响 J2/J4 分配）
#   5. 跳过旋转太小的相邻姿态

data_collector:
  ros__parameters:
    num_poses: 14
    settle_time: 2.0
    detection_timeout: 8.0
    min_valid_poses: 10
    data_dir: ''
    save_images: true

    # 使用 ALL_PAIRS 模式：对每一对姿态都计算相对变换，不局限于相邻
    # 这大大增加了有效数据量
    use_all_pairs: true

    # 最小旋转角阈值（度）：小于此值的姿态对被跳过
    min_rotation_deg: 8.0

    poses:
      # --- 正前方，不同距离和高低（pitch=π 竖直朝下）---
      - [0.22, 0.00, 0.30, 3.14159]    # 近
      - [0.32, 0.00, 0.30, 3.14159]    # 远（相同高度，指向更水平）

      # --- 正前方，不同 pitch（前倾，改变指向）---
      - [0.25, 0.00, 0.28, 2.80]       # 竖直偏20°（前倾）
      - [0.30, 0.00, 0.32, 2.44]       # 竖直偏40°（更前倾）

      # --- 左右两侧大角度，pitch=π ---
      - [0.25, -0.06, 0.30, 3.14159]   # 偏左 10cm
      - [0.30, -0.06, 0.28, 3.14159]   # 偏左稍远
      - [0.25,  0.06, 0.30, 3.14159]   # 偏右 10cm
      - [0.30,  0.06, 0.28, 3.14159]   # 偏右稍远

      # --- 不同高度的中心位置（不同 J2/J4 分配）---
      - [0.27, 0.00, 0.26, 3.14159]    # 较低
      - [0.27, 0.00, 0.34, 3.14159]    # 较高

      # --- 斜视角 + 偏侧（组合变化）---
      - [0.25, -0.04, 0.30, 2.80]      # 左 + 前倾20°
      - [0.30,  0.04, 0.30, 2.80]      # 右 + 前倾20°
      - [0.27, -0.04, 0.28, 2.44]      # 左 + 前倾40°
      - [0.27,  0.04, 0.28, 2.44]      # 右 + 前倾40°
