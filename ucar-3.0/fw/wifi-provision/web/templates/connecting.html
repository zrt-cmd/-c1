<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在连接</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>正在连接</h1>
    <div class="spinner"></div>
    <p>正在尝试连接到 <strong>{{ ssid }}</strong></p>
    <p class="hint">
      连接过程中热点会短暂关闭，手机可能提示断开，这是正常现象。<br>
      如果失败，热点会重新出现，请再次连接并重试。
    </p>
  </div>
</body>
</html>
