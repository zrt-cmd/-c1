# slam_toolbox configuration for car1 robot (COIN-D6 lidar)
slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS params
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_scan_matching: true
    use_scan_barycenter: true   # 旋转时重心偏移会引入假位移
    mode: mapping

    # Procesing rate (sec)
    map_update_interval: 1.0
    resolution: 0.02
    max_laser_range: 8.0
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # General params
    use_responsive_mutex: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_file_name: ''
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true

    # Scan acceptance thresholds (without these slam_toolbox falls back to
    # 0.5m / 0.5rad defaults, so the map only updates after large moves)
    #
    # Heading threshold raised to ~114° (2.0 rad) so a pure in-place rotation
    # (distance≈0) does NOT trigger a scan insert. Rationale: while the robot
    # spins in place, scan matching is less reliable (barycenter shift, slip,
    # low overlap between consecutive frames). With this, the map only inserts
    # new scans while the robot is translating, and heading during rotation is
    # carried by the EKF/IMU (verified ±1° accurate).
    minimum_travel_distance: 0.04
    minimum_travel_heading: 0.30
    scan_buffer_size: 100
    scan_buffer_maximum_scan_distance: 12.0

    debug_logging: false
    enable_interactive_mode: true

    # Correlation params
    correlation_search_space_dimension: 0.12
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure params
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Scan matcher params
    distance_variance_penalty: 0.04
    angle_variance_penalty: 0.10
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
